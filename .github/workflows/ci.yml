name: CI

on:
  push:
    branches: [windows]
  pull_request:
    branches: [windows]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ilammy/msvc-dev-cmd@v1

      - name: Point VCPKG_ROOT at the runner's vcpkg
        run: echo "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" >> $env:GITHUB_ENV

      - name: Configure
        run: cmake --preset default

      - name: Build
        shell: cmd
        run: |
          cmake --build --preset default > build.log 2>&1
          set BUILD_EXIT=%ERRORLEVEL%
          type build.log
          exit /b %BUILD_EXIT%

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Test
        shell: cmd
        run: ctest --preset default --output-on-failure > test.log 2>&1

      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-log
          path: test.log

      - name: Release build
        run: |
          cmake --preset release
          cmake --build --preset release

      - name: Stage artifact
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item build-release/ybar.exe dist/
          Copy-Item -Recurse shaders dist/shaders

      - uses: actions/upload-artifact@v4
        with:
          name: ybar-win
          path: dist/
