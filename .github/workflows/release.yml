name: Release

# Tag a release with `git tag win-v0.1.0 && git push origin win-v0.1.0`.
# The tag prefix keeps this branch's tags from colliding with the macOS tree's.
on:
  push:
    tags: ['win-v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (without the win-v prefix), e.g. 0.1.0'
        required: true

jobs:
  release:
    runs-on: windows-latest
    permissions:
      # id-token: the OIDC token for the Azure signing login (no stored
      # secrets). contents: write publishes the release.
      id-token: write
      contents: write
    env:
      # Empty on forks and until the repo variables are configured; the
      # signing steps below are skipped while it is empty, so a fork can
      # still cut a build and the release body says it is unsigned.
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: ilammy/msvc-dev-cmd@v1

      - name: Point VCPKG_ROOT at the runner's vcpkg
        run: echo "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" >> $env:GITHUB_ENV

      - name: Resolve version
        id: version
        run: |
          $v = if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
            '${{ github.event.inputs.version }}'
          } else {
            '${{ github.ref_name }}' -replace '^win-v',''
          }
          echo "value=$v" >> $env:GITHUB_OUTPUT
          echo "Building ybar-win $v"

      - name: Build and test
        run: |
          cmake --preset default
          cmake --build --preset default
          ctest --preset default --output-on-failure

      - name: Release build
        run: |
          cmake --preset release
          cmake --build --preset release

      - name: Stage payload
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item build-release/ybar.exe dist/
          Copy-Item -Recurse shaders dist/shaders
          Copy-Item -Recurse examples dist/examples
          Copy-Item README.md, LICENSE dist/
          $sdk = Get-ChildItem "C:/Program Files (x86)/Windows Kits/10/bin" -Directory |
                 Where-Object { $_.Name -like "10.*" } | Sort-Object Name | Select-Object -Last 1
          $dll = Join-Path $sdk.FullName "x64/d3dcompiler_47.dll"
          if (Test-Path $dll) { Copy-Item $dll dist/ }

      # --- Code signing (Azure Trusted Signing) -----------------------------
      # Signed BEFORE packaging: the zip hash is what the winget and scoop
      # manifests pin, so it has to cover the signed bits. Same OIDC managed
      # identity as ci.yml, no stored secrets. Smart App Control (enforcing on
      # stock Windows 11) refuses fresh unsigned binaries outright, so for the
      # asset users actually download this is load-bearing, not cosmetic.
      - name: Azure login (OIDC)
        if: env.AZURE_CLIENT_ID != ''
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Sign ybar.exe
        if: env.AZURE_CLIENT_ID != ''
        uses: azure/trusted-signing-action@v0
        with:
          endpoint: https://eus.codesigning.azure.net/
          trusted-signing-account-name: aegiosot
          certificate-profile-name: release-signing
          files-folder: ${{ github.workspace }}\dist
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      # Fails the release if signing was configured but did not take, and
      # otherwise states in the release body which kind of build this is.
      - name: Check signature
        id: sign
        run: |
          $sig = Get-AuthenticodeSignature dist/ybar.exe
          if ($env:AZURE_CLIENT_ID -and $sig.Status -ne 'Valid') {
            throw "signature status is $($sig.Status)"
          }
          $note = if ($sig.Status -eq 'Valid') {
            "Authenticode-signed: $($sig.SignerCertificate.Subject)"
          } else {
            'This build is **unsigned**: SmartScreen warns and Smart App Control may block it on first run.'
          }
          echo "note=$note" >> $env:GITHUB_OUTPUT
          Write-Host $note
      # ----------------------------------------------------------------------

      - name: Package
        id: package
        run: |
          $v = '${{ steps.version.outputs.value }}'
          $zip = "ybar-win-$v-x64.zip"
          Compress-Archive -Path dist/* -DestinationPath $zip
          # The hash is what the winget and scoop manifests pin.
          $sha = (Get-FileHash $zip -Algorithm SHA256).Hash
          echo "zip=$zip" >> $env:GITHUB_OUTPUT
          echo "sha256=$sha" >> $env:GITHUB_OUTPUT
          echo "SHA256 $sha  $zip"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: ybar-win ${{ steps.version.outputs.value }}
          files: ${{ steps.package.outputs.zip }}
          body: |
            ybar-win ${{ steps.version.outputs.value }} — x64, self-contained.

            `SHA256` `${{ steps.package.outputs.sha256 }}`

            Unpack anywhere, add the folder to `PATH`, then `ybar autostart enable`.

            ${{ steps.sign.outputs.note }}

            Package manifests to update with this hash live in `packaging/`.
