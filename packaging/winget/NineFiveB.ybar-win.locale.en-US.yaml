ShortDescription: GPU-rendered scriptable status bar for Windows with komorebi integration
Description: |-
  ybar-win is a GPU-rendered (Direct3D 11 + DirectComposition) status bar for
  Windows 11 with first-class komorebi integration. It keeps the
  sketchybar-style CLI and IPC grammar, an embedded Lua 5.4 config runtime,
  JSONC declarative configs, and themes, so configs written for YBar on macOS
  run with only OS-inherent edits.

  Providers cover volume (WASAPI), media (system transport controls), network
  and SSID, battery and power source, system stats, app lifecycle, and
  modifier keys. With komorebi it subscribes to workspace changes and reserves
  its strip through MonitorWorkAreaOffset; without it, the shell appbar API
  reserves the space instead.
Moniker: ybar
